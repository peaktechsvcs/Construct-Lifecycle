        "200":
          description: Branding context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingContext"
        "403": { description: Customer administrator permission required }
    put:
      operationId: saveBrandingDraft
      tags: [branding]
      summary: Save a branding draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingInput"
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingContext"
        "403": { description: Customer administrator permission required }
  /tenant/branding/published:
    get:
      operationId: getPublishedBranding
      tags: [branding]
      summary: Get published branding for the active customer environment
      responses:
        "200":
          description: Published branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedBrandingContext"
  /tenant/branding/publish:
    post:
      operationId: publishBranding
