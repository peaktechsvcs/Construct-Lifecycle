          name: providerKey
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_]{1,63}$"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Integration activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IntegrationActivity" }
        "404": { description: Integration provider not available }
components:
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        type: integer
    FollowUpId:
      in: path
      name: followUpId
      required: true
      schema:
        type: integer
    CustomerId:
      in: path
      name: customerId
      required: true
      schema:
        type: integer
    OpportunityId:
      in: path
      name: opportunityId
      required: true
      schema:
        type: integer
    BidId:
      in: path
      name: bidId
      required: true
      schema:
        type: integer
    EstimateId:
      in: path
      name: estimateId
      required: true
      schema:
        type: integer
    ProposalId:
      in: path
      name: proposalId
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Notification:
      type: object
      required: [key, kind, title, description, href, severity, createdAt, read]
      properties:
        key: { type: string }
        kind:
          type: string
          enum: [activity, follow_up]
        title: { type: string }
        description: { type: string }
        href: { type: string }
        severity:
          type: string
          enum: [info, attention, urgent]
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
        projectId: { type: ["integer", "null"] }
        projectName: { type: ["string", "null"] }
    NotificationListResponse:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        unreadCount: { type: integer }
    NotificationReadInput:
      type: object
      required: [notificationKeys]
      properties:
        notificationKeys:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 160 }
    ProjectStage:
      type: string
      pattern: "^[a-z][a-z0-9_]{1,62}$"
    OpportunityStage:
      type: string
      enum: [new, qualified, proposal, negotiation, won, lost]
    OpportunityOwner:
      type: object
      required: [userId, email, displayName]
      properties:
        userId: { type: integer }
        email: { type: ["string", "null"], format: email }
        displayName: { type: ["string", "null"] }
    Opportunity:
      type: object
      required: [id, environmentId, opportunityNumber, businessCustomerId, customerName, name, stage, estimatedValue, expectedCloseDate, ownerUserId, owner, leadSource, contactName, contactEmail, contactPhone, qualification, nextAction, nextActionDate, lastContactedAt, crmProviderKey, crmIntegrationStatus, crmExternalReference, crmLastSyncedAt, createdAt, updatedAt]
      properties:
        id: { type: integer }
        environmentId: { type: integer }
        opportunityNumber: { type: string }
        businessCustomerId: { type: integer }
        customerName: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        stage: { $ref: "#/components/schemas/OpportunityStage" }
        estimatedValue: { type: number }
        expectedCloseDate: { type: ["string", "null"], format: date }
        ownerUserId: { type: ["integer", "null"] }
        owner: { oneOf: [{ $ref: "#/components/schemas/OpportunityOwner" }, { type: "null" }] }
        leadSource: { type: ["string", "null"] }
        contactName: { type: ["string", "null"] }
        contactEmail: { type: ["string", "null"], format: email }
        contactPhone: { type: ["string", "null"] }
        qualification: { $ref: "#/components/schemas/OpportunityQualification" }
        nextAction: { type: ["string", "null"] }
