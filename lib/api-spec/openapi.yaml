        capabilityKey: { type: string }
        enabled: { type: boolean }
    CreateBillingPlanInput:
      type: object
      required: [name, monthlyAmount, annualAmount]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        monthlyAmount: { type: integer, minimum: 0 }
        annualAmount: { type: integer, minimum: 0 }
        entitlements: { type: object, additionalProperties: true }
        limits: { type: object, additionalProperties: true }
    CreateBillingPlanResponse:
      type: object
      required: [productId, priceIds]
      properties:
        productId: { type: string }
        priceIds:
          type: array
          items: { type: string }
    PlatformRelease:
      type: object
      required: [id, releaseType, status, version]
      properties:
        id: { type: integer }
        releaseType: { type: string, enum: [security, platform, feature] }
        status: { type: string, enum: [draft, released, deprecated] }
        version: { type: string }
        notes: { type: ["string", "null"] }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/EnvironmentReleaseAssignment" }
    EnvironmentReleaseAssignment:
      type: object
      required: [environmentId, releaseId, approvalStatus]
      properties:
        environmentId: { type: integer }
        releaseId: { type: integer }
        approvalStatus: { type: string, enum: [pending, approved, rejected, mandatory] }
        approvedAt: { type: ["string", "null"], format: date-time }
    BrandingInput:
      type: object
      additionalProperties: true
      properties:
        logoUrl: { type: [string, "null"] }
        primaryColor: { type: string }
        secondaryColor: { type: string }
        accentColor: { type: string }
        backgroundColor: { type: string }
        foregroundColor: { type: string }
    BrandingVersion:
      type: object
      required: [id, tenantId, environmentId, version, data, publishedAt]
      properties:
        id: { type: integer }
        tenantId: { type: integer }
        environmentId: { type: integer }
        version: { type: integer }
        data: { type: object, additionalProperties: true }
        publishedAt: { type: string, format: date-time }
    BrandingContext:
      type: object
      required: [draft, published]
      properties:
        draft: { $ref: "#/components/schemas/BrandingInput" }
        published:
          type: array
          items: { $ref: "#/components/schemas/BrandingVersion" }
    PublishedBrandingContext:
      type: object
      required: [published]
      properties:
        published:
          type: array
          items: { $ref: "#/components/schemas/BrandingVersion" }
    IntegrationCatalogItem:
      type: object
      required: [providerKey, name, category, categoryLabel, description, capabilities, connectorStatus, entitlement, connection, activity]
      properties:
        providerKey: { type: string }
        name: { type: string }
        category: { type: string, enum: [erp_financial, accounting, takeoff_estimating, ecommerce, product_information] }
        categoryLabel: { type: string }
        description: { type: string }
        capabilities:
          type: array
          items: { type: string }
        connectorStatus: { type: string, enum: [cataloged] }
        entitlement: { type: string, enum: [enabled] }
        connection:
          oneOf:
            - $ref: "#/components/schemas/IntegrationConnection"
            - type: "null"
        activity: { $ref: "#/components/schemas/IntegrationActivitySummary" }
    IntegrationConnection:
      type: object
      required: [id, status, connectionType, lastSyncAt, lastSyncStatus, lastError]
      properties:
        id: { type: integer }
        status: { type: string, enum: [not_connected, connected, warning, failed, disabled] }
        connectionType: { type: string }
        lastSyncAt: { type: ["string", "null"], format: date-time }
        lastSyncStatus: { type: ["string", "null"] }
        lastError: { type: ["string", "null"] }
    IntegrationActivitySummary:
      type: object
      required: [lastActivityAt, activityCount]
      properties:
        lastActivityAt: { type: ["string", "null"], format: date-time }
        activityCount: { type: integer }
    IntegrationActivity:
      type: object
      required: [id, providerKey, action, details, createdAt]
      properties:
        id: { type: integer }
        providerKey: { type: string }
        action: { type: string }
        details: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    WorkflowTemplate:
      type: object
      required: [id, tenantId, environmentId, name, status, isDefault, version, createdAt, updatedAt]
      properties:
        id: { type: integer }
        tenantId: { type: integer }
        environmentId: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        status: { type: string, enum: [draft, published, archived] }
        isDefault: { type: boolean }
        version: { type: integer }
        createdByUserId: { type: ["integer", "null"] }
        publishedByUserId: { type: ["integer", "null"] }
        publishedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkflowState:
      type: object
      required: [id, workflowTemplateId, stableKey, displayName, normalizedCategory, displayOrder, active, terminal, allowManualEnter, allowManualLeave, requiredFields, createdAt, updatedAt]
      properties:
        id: { type: integer }
        workflowTemplateId: { type: integer }
        stableKey: { type: string }
        displayName: { type: string }
        description: { type: ["string", "null"] }
        normalizedCategory: { type: string }
        displayOrder: { type: integer }
        active: { type: boolean }
        terminal: { type: boolean }
        allowManualEnter: { type: boolean }
        allowManualLeave: { type: boolean }
        defaultStatusKey: { type: ["string", "null"] }
        requiredFields:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkflowStatus:
      type: object
      required: [id, workflowTemplateId, stableKey, displayName, stateKeys, displayOrder, active, required, createdAt, updatedAt]
      properties:
        id: { type: integer }
        workflowTemplateId: { type: integer }
        stableKey: { type: string }
        displayName: { type: string }
        stateKeys:
          type: array
          items: { type: string }
        displayOrder: { type: integer }
        active: { type: boolean }
        required: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkflowTransition:
      type: object
      required: [id, workflowTemplateId, fromStateKey, toStateKey, active, requiresConfirmation, allowedRoles, requiredFields, warningFields, createdAt, updatedAt]
      properties:
        id: { type: integer }
        workflowTemplateId: { type: integer }
        fromStateKey: { type: string }
        toStateKey: { type: string }
        active: { type: boolean }
        requiresConfirmation: { type: boolean }
        allowedRoles:
          type: array
          items: { type: string }
        requiredFields:
          type: array
          items: { type: string }
        warningFields:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkflowConfig:
      type: object
      required: [template, states, statuses, transitions]
      properties:
        template: { $ref: "#/components/schemas/WorkflowTemplate" }
        states:
          type: array
          items: { $ref: "#/components/schemas/WorkflowState" }
        statuses:
          type: array
          items: { $ref: "#/components/schemas/WorkflowStatus" }
        transitions:
          type: array
          items: { $ref: "#/components/schemas/WorkflowTransition" }
    WorkflowConfigResponse:
      type: object
      required: [published, draft]
      properties:
        published: { $ref: "#/components/schemas/WorkflowConfig" }
        draft:
          oneOf:
            - $ref: "#/components/schemas/WorkflowConfig"
            - type: "null"
    WorkflowDraftResponse:
      type: object
      required: [draft]
      properties:
        draft:
          oneOf:
            - $ref: "#/components/schemas/WorkflowConfig"
            - type: "null"
    WorkflowConfigInput:
      type: object
      required: [states, statuses, transitions]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: ["string", "null"], maxLength: 1000 }
        states:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [stableKey, displayName, normalizedCategory, displayOrder]
            properties:
              stableKey: { type: string, pattern: "^[a-z][a-z0-9_]{1,62}$" }
              displayName: { type: string, minLength: 1, maxLength: 120 }
              description: { type: ["string", "null"], maxLength: 1000 }
              normalizedCategory: { type: string, minLength: 1, maxLength: 64 }
              displayOrder: { type: integer, minimum: 0, maximum: 1000 }
              active: { type: boolean }
              terminal: { type: boolean }
              allowManualEnter: { type: boolean }
              allowManualLeave: { type: boolean }
              defaultStatusKey: { type: ["string", "null"] }
              requiredFields:
                type: array
                items: { type: string, minLength: 1, maxLength: 80 }
        statuses:
          type: array
          maxItems: 200
          items:
            type: object
            required: [stableKey, displayName, displayOrder]
            properties:
              stableKey: { type: string, pattern: "^[a-z][a-z0-9_]{1,62}$" }
              displayName: { type: string, minLength: 1, maxLength: 120 }
              stateKeys:
                type: array
                items: { type: string }
              displayOrder: { type: integer, minimum: 0, maximum: 1000 }
              active: { type: boolean }
              required: { type: boolean }
        transitions:
          type: array
          maxItems: 500
          items:
            type: object
            required: [fromStateKey, toStateKey]
            properties:
              fromStateKey: { type: string }
              toStateKey: { type: string }
              active: { type: boolean }
              requiresConfirmation: { type: boolean }
              allowedRoles:
                type: array
                items: { type: string }
              requiredFields:
                type: array
                items: { type: string }
              warningFields:
                type: array
                items: { type: string }

