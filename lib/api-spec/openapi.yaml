openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project lifecycle operations
  - name: opportunities
    description: Pre-construction opportunity pipeline
  - name: customers
    description: Business customer records and project relationships
  - name: dashboard
    description: Dashboard summaries
  - name: notifications
    description: Customer-scoped alerts and notification read state
  - name: follow-ups
    description: Future work follow-ups
  - name: tenants
    description: Tenant context and membership operations
  - name: environments
    description: Customer environment context and switching
  - name: branding
    description: Tenant branding drafts and published versions
  - name: integrations
    description: Customer-scoped integration catalog and activity
  - name: membership
    description: Customer invitations and membership administration
  - name: platform
    description: Platform administrator customer lifecycle operations
  - name: billing
    description: Subscription plans, billing actions, entitlements, and audit history
  - name: workflows
    description: Tenant-configurable project lifecycle states, statuses, and transitions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: stage
          schema:
            $ref: "#/components/schemas/ProjectStage"
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Project deleted
  /opportunities:
    get:
      operationId: listOpportunities
      tags: [opportunities]
      summary: List opportunities for the active customer environment
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 120 }
        - in: query
          name: stage
          schema: { $ref: "#/components/schemas/OpportunityStage" }
        - in: query
          name: ownerUserId
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Opportunities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Opportunity" }
    post:
      operationId: createOpportunity
      tags: [opportunities]
      summary: Create an opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpportunityInput" }
      responses:
        "201":
          description: Opportunity created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Opportunity" }
  /opportunities/{opportunityId}:
    get:
      operationId: getOpportunity
      tags: [opportunities]
      summary: Get an opportunity
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      responses:
        "200":
          description: Opportunity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Opportunity" }
        "404": { description: Opportunity not found }
    patch:
      operationId: updateOpportunity
      tags: [opportunities]
      summary: Update an opportunity
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpportunityUpdate" }
      responses:
        "200":
          description: Updated opportunity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Opportunity" }
    delete:
      operationId: deleteOpportunity
      tags: [opportunities]
      summary: Delete an opportunity
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      responses:
        "204": { description: Opportunity deleted }
  /bids:
    get:
      operationId: listBids
      tags: [bids]
      summary: List bids for the active customer environment
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 120 }
        - in: query
          name: stage
          schema: { $ref: "#/components/schemas/BidStage" }
        - in: query
          name: ownerUserId
          schema: { type: integer, minimum: 1 }
        - in: query
          name: bidType
          schema: { $ref: "#/components/schemas/BidType" }
        - in: query
          name: scopeMode
          schema: { $ref: "#/components/schemas/BidScopeMode" }
      responses:
        "200":
          description: Bids
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Bid" }
    post:
      operationId: createBid
      tags: [bids]
      summary: Create a bid
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BidInput" }
      responses:
        "201":
          description: Bid created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bid" }
  /bids/{bidId}:
    get:
      operationId: getBid
      tags: [bids]
      summary: Get a bid
      parameters:
        - $ref: "#/components/parameters/BidId"
      responses:
        "200":
          description: Bid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bid" }
        "404": { description: Bid not found }
    patch:
      operationId: updateBid
      tags: [bids]
      summary: Update a bid
      parameters:
        - $ref: "#/components/parameters/BidId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BidUpdate" }
      responses:
        "200":
          description: Updated bid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bid" }
    delete:
      operationId: deleteBid
      tags: [bids]
      summary: Delete a bid
      parameters:
        - $ref: "#/components/parameters/BidId"
      responses:
        "204": { description: Bid deleted }
  /estimates:
    get:
      operationId: listEstimates
      tags: [estimates]
      summary: List estimates for the active customer environment
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 120 }
        - in: query
          name: stage
          schema: { $ref: "#/components/schemas/EstimateStage" }
        - in: query
          name: ownerUserId
          schema: { type: integer, minimum: 1 }
        - in: query
          name: integrationStatus
          schema: { $ref: "#/components/schemas/EstimateIntegrationStatus" }
      responses:
        "200":
          description: Estimates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Estimate" }
    post:
      operationId: createEstimate
      tags: [estimates]
      summary: Create an estimate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstimateInput" }
      responses:
        "201":
          description: Estimate created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Estimate" }
  /estimates/{estimateId}:
    get:
      operationId: getEstimate
      tags: [estimates]
      summary: Get an estimate
      parameters:
        - $ref: "#/components/parameters/EstimateId"
      responses:
        "200":
          description: Estimate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Estimate" }
        "404": { description: Estimate not found }
    patch:
      operationId: updateEstimate
      tags: [estimates]
      summary: Update an estimate
      parameters:
        - $ref: "#/components/parameters/EstimateId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstimateUpdate" }
      responses:
        "200":
          description: Updated estimate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Estimate" }
    delete:
      operationId: deleteEstimate
      tags: [estimates]
      summary: Delete an estimate
      parameters:
        - $ref: "#/components/parameters/EstimateId"
      responses:
        "204": { description: Estimate deleted }
  /proposals:
    get:
      operationId: listProposals
      tags: [proposals]
      summary: List proposals for the active customer environment
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 120 }
        - in: query
          name: stage
          schema: { $ref: "#/components/schemas/ProposalStage" }
        - in: query
          name: ownerUserId
          schema: { type: integer, minimum: 1 }
        - in: query
          name: integrationStatus
          schema: { $ref: "#/components/schemas/ProposalIntegrationStatus" }
      responses:
        "200":
          description: Proposals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Proposal" }
    post:
      operationId: createProposal
      tags: [proposals]
      summary: Create a proposal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposalInput" }
      responses:
        "201":
          description: Proposal created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
  /proposals/{proposalId}:
    get:
      operationId: getProposal
      tags: [proposals]
      summary: Get a proposal
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      responses:
        "200":
          description: Proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
        "404": { description: Proposal not found }
    patch:
      operationId: updateProposal
      tags: [proposals]
      summary: Update a proposal
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposalUpdate" }
      responses:
        "200":
          description: Updated proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
    delete:
      operationId: deleteProposal
      tags: [proposals]
      summary: Delete a proposal
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      responses:
        "204": { description: Proposal deleted }
  /projects/{projectId}/activity:
    get:
      operationId: listProjectActivity
      tags: [projects]
      summary: List project activity
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /workflow/config:
    get:
      operationId: getWorkflowConfig
      tags: [workflows]
      summary: Get the active tenant workflow configuration
      responses:
        "200":
          description: Published and draft workflow configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowConfigResponse" }
  /workflow/draft:
    post:
      operationId: createWorkflowDraft
      tags: [workflows]
      summary: Create a tenant workflow draft from the published configuration
      responses:
        "201":
          description: Workflow draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowDraftResponse" }
        "403": { description: Tenant administrator permission required }
    put:
      operationId: updateWorkflowDraft
      tags: [workflows]
      summary: Replace the tenant workflow draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowConfigInput" }
      responses:
        "200":
          description: Updated workflow configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowConfigResponse" }
        "403": { description: Tenant administrator permission required }
        "422": { description: Workflow validation failed }
  /workflow/draft/publish:
    post:
      operationId: publishWorkflowDraft
      tags: [workflows]
      summary: Validate and publish the tenant workflow draft
      responses:
        "200":
          description: Published workflow configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowConfigResponse" }
        "403": { description: Tenant administrator permission required }
        "422": { description: Workflow validation failed }
  /customers:
    get:
      operationId: listBusinessCustomers
      tags: [customers]
      summary: List business customers in the active workspace
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
        - in: query
          name: includeArchived
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Business customers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BusinessCustomerSummary" }
    post:
      operationId: createBusinessCustomer
      tags: [customers]
      summary: Create a business customer in the active workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessCustomerInput" }
      responses:
        "201":
          description: Business customer created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessCustomer" }
        "403": { description: Customer creation permission required }
        "409": { description: A customer with the same normalized name already exists }
  /customers/{customerId}:
    get:
      operationId: getBusinessCustomer
      tags: [customers]
      summary: Get a business customer and its projects
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Business customer detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessCustomer" }
        "404": { description: Business customer not found }
    patch:
      operationId: updateBusinessCustomer
      tags: [customers]
      summary: Update a business customer
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessCustomerUpdate" }
      responses:
        "200":
          description: Updated business customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessCustomer" }
        "403": { description: Customer management permission required }
        "404": { description: Business customer not found }
        "409": { description: A customer with the same normalized name already exists }
  /follow-ups:
    get:
      operationId: listFollowUps
      tags: [follow-ups]
      summary: List future work follow-ups
      responses:
        "200":
          description: Follow-ups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FollowUp"
    post:
      operationId: createFollowUp
      tags: [follow-ups]
      summary: Create a follow-up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowUpInput"
      responses:
        "201":
          description: Follow-up created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUp"
  /follow-ups/{followUpId}:
    patch:
      operationId: updateFollowUp
      tags: [follow-ups]
      summary: Update a follow-up
      parameters:
        - $ref: "#/components/parameters/FollowUpId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowUpUpdate"
      responses:
        "200":
          description: Follow-up updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUp"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: listRecentActivity
      tags: [dashboard]
      summary: List recent activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for the active customer environment
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [all, unread]
            default: all
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 30
      responses:
        "200":
          description: Notifications and unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
  /notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Mark selected notifications as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationReadInput"
      responses:
        "204": { description: Notifications marked as read }
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all current notifications as read
      responses:
        "204": { description: Notifications marked as read }
  /dashboard/drilldown:
    get:
      operationId: getDashboardDrilldown
      tags: [dashboard]
      summary: Inspect records contributing to a dashboard metric
      parameters:
        - in: query
          name: type
          required: true
          schema:
            $ref: "#/components/schemas/DashboardDrilldownType"
        - in: query
          name: stage
          schema:
            $ref: "#/components/schemas/ProjectStage"
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: sort
          schema:
            $ref: "#/components/schemas/DashboardDrilldownSort"
      responses:
        "200":
          description: Dashboard supporting records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardDrilldownResponse"
        "400": { description: Invalid drilldown discriminator or stage }
  /tenant/context:
    get:
      operationId: getTenantContext
      tags: [tenants]
      summary: Get the active tenant context
      responses:
        "200":
          description: Active tenant and memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantContext"
    post:
      operationId: switchTenant
      tags: [tenants]
      summary: Switch the active tenant after membership validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchTenantInput"
      responses:
        "200":
          description: Updated tenant context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantContext"
        "403": { description: User is not a member of the tenant }
  /tenant/environments:
    get:
      operationId: listEnvironments
      tags: [environments]
      summary: List environments authorized for the active customer
      responses:
        "200":
          description: Authorized customer environments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Environment" }
    post:
      operationId: switchEnvironment
      tags: [environments]
      summary: Switch the active customer environment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchEnvironmentInput" }
      responses:
        "200":
          description: Updated customer environment context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantContext" }
        "403": { description: User is not authorized for the environment }
  /features:
    get:
      operationId: listFeatureFlags
      tags: [features]
      summary: List feature visibility for the current user
      responses:
        "200":
          description: Feature catalog visible to the current user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeatureFlag" }
  /platform/features/{featureKey}:
    patch:
      operationId: updateFeatureFlag
      tags: [platform]
      summary: Toggle an upcoming feature for tenant visibility
      parameters:
        - name: featureKey
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureFlagUpdate"
      responses:
        "200":
          description: Updated feature flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureFlag" }
        "400": { description: Invalid feature key or update }
        "403": { description: Platform administrator permission required }
  /feedback/features:
    get:
      operationId: listFeatureFeedback
      tags: [feedback]
      summary: List upcoming features available for tenant voting
      responses:
        "200":
          description: Upcoming feature poll
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeatureFeedbackItem" }
  /feedback/vote:
    post:
      operationId: voteForFeature
      tags: [feedback]
      summary: Cast the current tenant user's feature vote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureFeedbackVoteInput"
      responses:
        "200":
          description: Updated upcoming feature poll
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeatureFeedbackItem" }
        "400": { description: Invalid or unavailable feature }
  /tenant/members:
    get:
      operationId: listTenantMembers
      tags: [membership]
      summary: List members of the active customer
      responses:
        "200":
          description: Customer members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TenantMember" }
        "403": { description: Customer administrator permission required }
  /tenant/members/{userId}:
    patch:
      operationId: updateTenantMember
      tags: [membership]
      summary: Change a customer's member role
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTenantMemberInput" }
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantMember" }
        "403": { description: Customer administrator permission required }
        "409": { description: The last owner cannot be removed }
    delete:
      operationId: removeTenantMember
      tags: [membership]
      summary: Remove a member from the active customer
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Member removed }
        "403": { description: Customer administrator permission required }
        "409": { description: The last owner cannot be removed }
  /tenant/invitations:
    get:
      operationId: listTenantInvitations
      tags: [membership]
      summary: List invitations for the active customer
      responses:
        "200":
          description: Customer invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TenantInvitation" }
        "403": { description: Customer administrator permission required }
    post:
      operationId: createTenantInvitation
      tags: [membership]
      summary: Invite a user to the active customer
