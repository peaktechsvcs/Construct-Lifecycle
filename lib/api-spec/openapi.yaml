        currency: { type: ["string", "null"] }
        amountDue: { type: ["integer", "null"] }
        amountPaid: { type: ["integer", "null"] }
        hostedInvoiceUrl: { type: ["string", "null"], format: uri }
        invoicePdf: { type: ["string", "null"], format: uri }
        created: { type: ["integer", "null"] }
    BillingAuditEvent:
      type: object
      required: [id, tenantId, action, details, createdAt]
      properties:
        id: { type: integer }
        tenantId: { type: integer }
        action: { type: string }
        previousState: { type: ["string", "null"] }
        newState: { type: ["string", "null"] }
        providerReference: { type: ["string", "null"] }
        details: { type: string }
        createdAt: { type: string, format: date-time }
    EntitlementOverride:
      type: object
      required: [id, tenantId, capabilityKey, enabled]
      properties:
        id: { type: integer }
        tenantId: { type: integer }
        capabilityKey: { type: string }
        enabled: { type: boolean }
    EntitlementOverrideInput:
      type: object
      required: [capabilityKey, enabled]
