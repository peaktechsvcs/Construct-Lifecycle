openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project lifecycle operations
  - name: dashboard
    description: Dashboard summaries
  - name: follow-ups
    description: Future work follow-ups
  - name: tenants
    description: Tenant context and membership operations
  - name: environments
    description: Customer environment context and switching
  - name: branding
    description: Tenant branding drafts and published versions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: stage
          schema:
            $ref: "#/components/schemas/ProjectStage"
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Project deleted
  /projects/{projectId}/activity:
    get:
      operationId: listProjectActivity
      tags: [projects]
      summary: List project activity
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /follow-ups:
    get:
      operationId: listFollowUps
      tags: [follow-ups]
      summary: List future work follow-ups
      responses:
        "200":
          description: Follow-ups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FollowUp"
    post:
      operationId: createFollowUp
      tags: [follow-ups]
      summary: Create a follow-up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowUpInput"
      responses:
        "201":
          description: Follow-up created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUp"
  /follow-ups/{followUpId}:
    patch:
      operationId: updateFollowUp
      tags: [follow-ups]
      summary: Update a follow-up
      parameters:
        - $ref: "#/components/parameters/FollowUpId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowUpUpdate"
      responses:
        "200":
          description: Follow-up updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUp"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: listRecentActivity
      tags: [dashboard]
      summary: List recent activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /tenant/context:
    get:
      operationId: getTenantContext
      tags: [tenants]
      summary: Get the active tenant context
      responses:
        "200":
          description: Active tenant and memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantContext"
    post:
      operationId: switchTenant
      tags: [tenants]
      summary: Switch the active tenant after membership validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchTenantInput"
      responses:
        "200":
          description: Updated tenant context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantContext"
        "403": { description: User is not a member of the tenant }
  /tenant/environments:
    get:
      operationId: listEnvironments
      tags: [environments]
      summary: List environments authorized for the active customer
      responses:
        "200":
          description: Authorized customer environments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Environment" }
    post:
      operationId: switchEnvironment
      tags: [environments]
      summary: Switch the active customer environment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchEnvironmentInput" }
      responses:
        "200":
          description: Updated customer environment context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantContext" }
        "403": { description: User is not authorized for the environment }
  /platform/releases:
    get:
      operationId: listPlatformReleases
      tags: [environments]
      summary: List platform releases and environment assignments
      responses:
        "200":
          description: Platform releases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformRelease" }
  /tenant/branding:
    get:
      operationId: getBranding
      tags: [branding]
      summary: Get branding context and current draft
      responses:
        "200":
          description: Branding context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingContext"
    put:
      operationId: saveBrandingDraft
      tags: [branding]
      summary: Save a branding draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingInput"
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingContext"
  /tenant/branding/publish:
    post:
      operationId: publishBranding
      tags: [branding]
      summary: Publish the draft after WCAG AA contrast validation
      responses:
        "200":
          description: Published branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingVersion"
        "422": { description: Branding fails WCAG AA contrast validation }
  /tenant/branding/rollback/{version}:
    post:
      operationId: rollbackBranding
      tags: [branding]
      summary: Roll back to an immutable published version
      parameters:
        - in: path
          name: version
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Rolled-back draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingContext"
        "404": { description: Version not found }
  /tenant/branding/reset:
    post:
      operationId: resetBranding
      tags: [branding]
      summary: Reset branding draft to Construct LC defaults
      responses:
        "200":
          description: Reset draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingContext"
components:
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        type: integer
    FollowUpId:
      in: path
      name: followUpId
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProjectStage:
      type: string
      enum:
        - lead
        - proposal
        - awarded
        - contracted
        - in_progress
        - billing
        - closeout
        - follow_up
        - lost
    ProposalStatus:
      type: string
      enum: [not_started, drafting, submitted, revised, accepted]
    BidOutcome:
      type: string
      enum: [pending, won, lost, no_bid]
    ContractStatus:
      type: string
      enum: [none, requested, active, complete]
    BillingStatus:
      type: string
      enum: [not_started, deposit_pending, invoicing, partially_paid, paid]
    CloseoutStatus:
      type: string
      enum: [not_started, punch_list, customer_review, complete]
    Project:
      type: object
      required:
        - id
        - projectNumber
        - customerName
        - projectName
        - category
        - stage
        - proposalStatus
        - bidOutcome
        - contractStatus
        - contractValue
        - deliveryPercent
        - billingStatus
        - invoicedAmount
        - receivedAmount
        - closeoutStatus
        - createdAt
        - updatedAt
      properties:
        id: { type: integer }
        environmentId: { type: integer }
        projectNumber: { type: string }
        customerName: { type: string }
        projectName: { type: string }
        address: { type: ["string", "null"] }
        category: { type: string }
        productCategories:
          type: array
          items: { type: string }
        owner: { type: ["string", "null"] }
        stage: { $ref: "#/components/schemas/ProjectStage" }
        proposalStatus: { $ref: "#/components/schemas/ProposalStatus" }
        proposalDetails: { type: ["string", "null"] }
        bidOutcome: { $ref: "#/components/schemas/BidOutcome" }
        contractStatus: { $ref: "#/components/schemas/ContractStatus" }
        contractValue: { type: number }
        contractDetails: { type: ["string", "null"] }
        contractStart: { type: ["string", "null"], format: date }
        contractEnd: { type: ["string", "null"], format: date }
        deliveryPercent: { type: integer, minimum: 0, maximum: 100 }
        requirementsSummary: { type: ["string", "null"] }
        billingStatus: { $ref: "#/components/schemas/BillingStatus" }
        invoicedAmount: { type: number }
        receivedAmount: { type: number }
        billingDetails: { type: ["string", "null"] }
        closeoutStatus: { $ref: "#/components/schemas/CloseoutStatus" }
        closeoutDetails: { type: ["string", "null"] }
        nextFollowUp: { type: ["string", "null"], format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectInput:
      type: object
      required: [customerName, projectName, category]
      properties:
        environmentId: { type: integer, minimum: 1 }
        customerName: { type: string, minLength: 1 }
        projectName: { type: string, minLength: 1 }
        address: { type: string }
        category: { type: string }
        productCategories:
          type: array
          items: { type: string }
        owner: { type: string }
        stage: { $ref: "#/components/schemas/ProjectStage" }
        proposalStatus: { $ref: "#/components/schemas/ProposalStatus" }
        proposalDetails: { type: string }
        bidOutcome: { $ref: "#/components/schemas/BidOutcome" }
        contractStatus: { $ref: "#/components/schemas/ContractStatus" }
        contractValue: { type: number }
        contractDetails: { type: string }
        contractStart: { type: string, format: date }
        contractEnd: { type: string, format: date }
        deliveryPercent: { type: integer, minimum: 0, maximum: 100 }
        requirementsSummary: { type: string }
        billingStatus: { $ref: "#/components/schemas/BillingStatus" }
        invoicedAmount: { type: number }
        receivedAmount: { type: number }
        billingDetails: { type: string }
        closeoutStatus: { $ref: "#/components/schemas/CloseoutStatus" }
        closeoutDetails: { type: string }
        nextFollowUp: { type: string, format: date }
    ProjectUpdate:
      allOf:
        - $ref: "#/components/schemas/ProjectInput"
    Activity:
      type: object
      required: [id, projectId, action, description, createdAt]
      properties:
        id: { type: integer }
        environmentId: { type: integer }
        projectId: { type: integer }
        projectName: { type: ["string", "null"] }
        action: { type: string }
        description: { type: string }
        actor: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    FollowUp:
      type: object
      required: [id, projectId, customerName, projectName, dueDate, status, note]
      properties:
        id: { type: integer }
        environmentId: { type: integer }
        projectId: { type: integer }
        customerName: { type: string }
        projectName: { type: string }
        dueDate: { type: string, format: date }
        status:
          type: string
          enum: [open, completed]
        note: { type: string }
        createdAt: { type: string, format: date-time }
    FollowUpInput:
      type: object
      required: [projectId, dueDate, note]
      properties:
        projectId: { type: integer }
        dueDate: { type: string, format: date }
        note: { type: string, minLength: 1 }
    FollowUpUpdate:
      type: object
      properties:
        dueDate: { type: string, format: date }
        note: { type: string }
        status:
          type: string
          enum: [open, completed]
    DashboardSummary:
      type: object
      required:
        - activeProjects
        - pipelineValue
        - awardedValue
        - receivedValue
        - invoicedValue
        - openFollowUps
        - stageCounts
      properties:
        activeProjects: { type: integer }
        pipelineValue: { type: number }
        awardedValue: { type: number }
        invoicedValue: { type: number }
        receivedValue: { type: number }
        openFollowUps: { type: integer }
        stageCounts:
          type: array
          items:
            type: object
            required: [stage, count, value]
            properties:
              stage: { $ref: "#/components/schemas/ProjectStage" }
              count: { type: integer }
              value: { type: number }
    Tenant:
      type: object
      required: [id, name, slug, role]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
    Environment:
      type: object
      required: [id, tenantId, name, slug, kind, status]
      properties:
        id: { type: integer }
        tenantId: { type: integer }
        name: { type: string }
        slug: { type: string }
        kind: { type: string, enum: [production, dtd] }
        status: { type: string, enum: [active, suspended, provisioning, archived] }
        provisioningStatus: { type: ["string", "null"] }
        provisionedAt: { type: ["string", "null"], format: date-time }
    TenantContext:
      type: object
      required: [activeTenant, memberships, activeEnvironment, environments, environmentLabel]
      properties:
        activeTenant: { $ref: "#/components/schemas/Tenant" }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/Tenant" }
        activeEnvironment: { $ref: "#/components/schemas/Environment" }
        environments:
          type: array
          items: { $ref: "#/components/schemas/Environment" }
        environmentLabel: { type: string, enum: [development, demo, production] }
    SwitchTenantInput:
      type: object
      required: [tenantId]
      properties:
        tenantId: { type: integer, minimum: 1 }
    SwitchEnvironmentInput:
      type: object
      required: [environmentId]
      properties:
        environmentId: { type: integer, minimum: 1 }
    PlatformRelease:
      type: object
      required: [id, releaseType, status, version]
      properties:
        id: { type: integer }
        releaseType: { type: string, enum: [security, platform, feature] }
        status: { type: string, enum: [draft, released, deprecated] }
        version: { type: string }
        notes: { type: ["string", "null"] }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/EnvironmentReleaseAssignment" }
    EnvironmentReleaseAssignment:
      type: object
      required: [environmentId, releaseId, approvalStatus]
      properties:
        environmentId: { type: integer }
        releaseId: { type: integer }
        approvalStatus: { type: string, enum: [pending, approved, rejected, mandatory] }
        approvedAt: { type: ["string", "null"], format: date-time }
    BrandingInput:
      type: object
      additionalProperties: true
      properties:
        logoUrl: { type: [string, "null"] }
        primaryColor: { type: string }
        secondaryColor: { type: string }
        accentColor: { type: string }
        backgroundColor: { type: string }
        foregroundColor: { type: string }
    BrandingVersion:
      type: object
      required: [id, tenantId, environmentId, version, data, publishedAt]
      properties:
        id: { type: integer }
        tenantId: { type: integer }
        environmentId: { type: integer }
        version: { type: integer }
        data: { type: object, additionalProperties: true }
        publishedAt: { type: string, format: date-time }
    BrandingContext:
      type: object
      required: [draft, published]
      properties:
        draft: { $ref: "#/components/schemas/BrandingInput" }
        published:
          type: array
          items: { $ref: "#/components/schemas/BrandingVersion" }

