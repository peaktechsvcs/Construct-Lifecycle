      tags: [branding]
      summary: Roll back to an immutable published version
      parameters:
        - in: path
          name: version
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Rolled-back draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingContext"
        "404": { description: Version not found }
  /tenant/branding/reset:
    post:
      operationId: resetBranding
      tags: [branding]
      summary: Reset branding draft to Construct Lifecycle defaults
      responses:
        "200":
          description: Reset draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingContext"
  /integrations:
    get:
      operationId: listIntegrations
      tags: [integrations]
      summary: List entitled integrations for the active customer environment
      responses:
        "200":
          description: Entitled integration catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IntegrationCatalogItem" }
        "403": { description: Customer administrator permission required }
  /integrations/{providerKey}/connect:
    post:
      operationId: connectIntegration
      tags: [integrations]
      summary: Attach an authorized managed connector to the active customer environment
      parameters:
        - $ref: "#/components/parameters/IntegrationProviderKey"
      responses:
        "200":
          description: Connected integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationConnection"
        "403": { description: Customer administrator permission required }
        "404": { description: Integration provider not entitled }
        "409": { description: Connector authorization is ambiguous or attached to another environment }
        "424": { description: Managed connector authorization is required or unavailable }
  /integrations/{providerKey}/revoke:
    post:
      operationId: revokeIntegration
      tags: [integrations]
      summary: Revoke this customer environment's access to a managed connector
      parameters:
        - $ref: "#/components/parameters/IntegrationProviderKey"
      responses:
        "200":
          description: Revoked integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationConnection"
        "403": { description: Customer administrator permission required }
        "404": { description: Connected integration not found }
  /integrations/activity:
    get:
      operationId: listIntegrationActivity
      tags: [integrations]
      summary: List integration configuration and audit activity
      parameters:
        - in: query
          name: providerKey
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_]{1,63}$"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Integration activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IntegrationActivity" }
        "404": { description: Integration provider not available }
  /integrations/jobs:
    get:
      operationId: listIntegrationJobs
      tags: [integrations]
      summary: List connector job history for the active customer environment
      parameters:
        - in: query
          name: providerKey
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_]{1,63}$"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Integration job history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IntegrationJob" }
        "403": { description: Customer administrator permission required }
        "404": { description: Integration provider not available }
  /platform/environments/{environmentId}/resources:
    get:
      operationId: getEnvironmentResources
      tags: [provisioning]
      summary: Inspect isolated environment resources
      parameters:
        - in: path
          name: environmentId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Resource inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentResourceInventory" }
  /platform/environments/{environmentId}/provisioning-events:
    get:
      operationId: listProvisioningEvents
      tags: [provisioning]
      summary: List auditable provisioning transitions
      parameters:
        - in: path
          name: environmentId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Provisioning event history
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
  /platform/environments/{environmentId}/provision:
    post:
      operationId: provisionEnvironment
      tags: [provisioning]
      summary: Provision all isolated environment resources
      parameters:
        - in: path
          name: environmentId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProvisionEnvironmentInput" }
      responses:
        "201": { description: Isolated context provisioned }
        "503": { description: Provider unavailable or provisioning failed }
  /platform/environments/{environmentId}/verify:
    post:
      operationId: verifyEnvironment
      tags: [provisioning]
      summary: Verify isolated environment health
      parameters:
        - in: path
          name: environmentId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdempotencyInput" }
      responses:
        "200": { description: Environment is healthy }
        "503": { description: Environment is not ready }
  /platform/environments/{environmentId}/enforce-isolation:
    post:
      operationId: enforceEnvironmentIsolation
      tags: [provisioning]
      summary: Enforce isolated execution after rollout verification
      parameters:
        - in: path
          name: environmentId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200": { description: Isolation enforcement enabled }
        "409": { description: Resources or health check are not ready }
  /platform/environments/{environmentId}/refresh:
    post:
      operationId: refreshDtdEnvironment
      tags: [provisioning]
      summary: Refresh D/T/D from same-customer Production with sanitization
      parameters:
        - in: path
          name: environmentId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshEnvironmentInput" }
      responses:
        "201": { description: Refresh accepted and audited }
        "409": { description: Invalid refresh request }
        "503": { description: Provider unavailable or refresh failed }
  /platform/environments/{environmentId}/snapshots:
    post:
      operationId: createEnvironmentBackup
      tags: [provisioning]
      summary: Create and verify a provider backup snapshot
      parameters:
        - in: path
          name: environmentId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdempotencyInput" }
      responses:
        "201": { description: Backup snapshot verified }
        "503": { description: Provider unavailable or backup failed }
  /platform/snapshots/{snapshotId}/verify:
    post:
      operationId: verifyEnvironmentSnapshot
      tags: [provisioning]
      summary: Verify a provider backup snapshot
      parameters:
        - in: path
          name: snapshotId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdempotencyInput" }
      responses:
        "200": { description: Snapshot verified }
        "503": { description: Provider unavailable }
  /platform/snapshots/{snapshotId}/restore:
    post:
      operationId: restoreEnvironmentSnapshot
      tags: [provisioning]
      summary: Restore or roll back to a verified snapshot
      parameters:
        - in: path
          name: snapshotId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreSnapshotInput" }
      responses:
        "200": { description: Restore completed and target verified immediately }
        "202": { description: Restore accepted and pending provider verification }
        "409": { description: Snapshot is not verified }
        "502": { description: Provider restore or target verification failed }
        "503": { description: Provider unavailable or restore failed to start }
  /platform/provisioning-operations/{operationId}:
    get:
      operationId: getProvisioningOperation
      tags: [provisioning]
      summary: Poll an asynchronous restore, refresh, or rollback operation
      parameters:
        - in: path
          name: operationId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200": { description: Recovery operation completed successfully }
        "202": { description: Recovery operation is still pending provider verification }
        "400": { description: Operation is not a recovery operation }
        "404": { description: Operation not found }
        "502": { description: Recovery operation failed }
  /platform/release-assignments/{assignmentId}/rollback:
    post:
      operationId: rollbackEnvironmentRelease
      tags: [provisioning]
      summary: Roll back a promoted release to its verified snapshot
      parameters:
        - in: path
          name: assignmentId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreSnapshotInput" }
      responses:
        "200": { description: Rollback completed and target verified immediately }
        "202": { description: Rollback accepted and pending provider verification }
        "409": { description: Release has no verified rollback snapshot }
        "502": { description: Provider rollback or target verification failed }
        "503": { description: Provider unavailable or rollback failed to start }
components:
  parameters:
    IntegrationProviderKey:
      in: path
      name: providerKey
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_]{1,63}$"
    ItbIntakeId:
      in: path
      name: intakeId
      required: true
      schema: { type: integer, minimum: 1 }
    ItbDocumentId:
      in: path
      name: documentId
      required: true
      schema: { type: integer, minimum: 1 }
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        type: integer
    ProjectScheduleItemId:
      in: path
      name: itemId
      required: true
      schema:
        type: integer
    ProjectSovLineId:
      in: path
      name: lineId
      required: true
      schema:
        type: integer
    ProjectCommitmentId:
      in: path
      name: commitmentId
      required: true
      schema:
        type: integer
    ProjectIssueId:
      in: path
      name: issueId
      required: true
      schema:
        type: integer
    ProjectChangeOrderId:
      in: path
      name: changeOrderId
      required: true
      schema:
        type: integer
    ProjectPayApplicationId:
      in: path
      name: applicationId
      required: true
      schema:
        type: integer
    ProjectCloseoutRequirementId:
      in: path
      name: requirementId
      required: true
      schema:
        type: integer
    FollowUpId:
      in: path
      name: followUpId
      required: true
      schema:
        type: integer
    CustomerId:
      in: path
      name: customerId
      required: true
      schema:
        type: integer
    OpportunityId:
      in: path
      name: opportunityId
      required: true
      schema:
        type: integer
    OpportunityActivityId:
      in: path
      name: activityId
      required: true
      schema:
        type: integer
    BidId:
      in: path
      name: bidId
      required: true
      schema:
        type: integer
    BidScopeId:
      in: path
      name: scopeId
      required: true
      schema:
        type: integer
    EstimateId:
      in: path
      name: estimateId
      required: true
      schema:
        type: integer
    ProposalId:
      in: path
      name: proposalId
      required: true
      schema:
        type: integer
    SubmittalId:
      in: path
      name: submittalId
      required: true
      schema:
        type: integer
    SubmittalItemId:
      in: path
      name: itemId
      required: true
      schema:
        type: integer
    SubmittalDocumentId:
      in: path
      name: documentId
      required: true
      schema:
        type: integer
    SubmittalAssemblyId:
      in: path
      name: assemblyId
      required: true
      schema:
        type: integer
    SubmittalCoordinationId:
      in: path
      name: coordinationId
      required: true
      schema:
        type: integer
    TradePartnerId:
      in: path
      name: tradePartnerId
      required: true
      schema:
        type: integer
    ComplianceDocumentId:
      in: path
      name: documentId
      required: true
      schema:
        type: integer
    ProjectComplianceRequirementId:
      in: path
      name: requirementId
      required: true
      schema:
        type: integer
    SubcontractAgreementId:
      in: path
      name: agreementId
      required: true
      schema:
        type: integer
    SubcontractPayApplicationId:
      in: path
      name: applicationId
      required: true
      schema:
        type: integer
    SupplierProductId:
      in: path
      name: productId
      required: true
      schema:
        type: integer
    SupplierQuoteId:
      in: path
      name: quoteId
      required: true
      schema:
        type: integer
    SupplierOrderId:
      in: path
      name: orderId
      required: true
      schema:
        type: integer
    SupplierDeliveryId:
      in: path
      name: deliveryId
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Notification:
      type: object
      required: [key, kind, title, description, href, severity, createdAt, read]
      properties:
        key: { type: string }
        kind:
          type: string
          enum: [activity, follow_up]
        title: { type: string }
        description: { type: string }
        href: { type: string }
        severity:
          type: string
          enum: [info, attention, urgent]
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
        projectId: { type: ["integer", "null"] }
        projectName: { type: ["string", "null"] }
    NotificationListResponse:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        unreadCount: { type: integer }
    NotificationReadInput:
      type: object
      required: [notificationKeys]
      properties:
        notificationKeys:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 160 }
    ProjectStage:
      type: string
      pattern: "^[a-z][a-z0-9_]{1,62}$"
    OpportunityStage:
      type: string
      enum: [new, qualified, proposal, negotiation, won, lost]
    OpportunityOwner:
      type: object
      required: [userId, email, displayName]
      properties:
        userId: { type: integer }
        email: { type: ["string", "null"], format: email }
        displayName: { type: ["string", "null"] }
    ItbIntakeStatus:
      type: string
      enum: [review, approved, rejected, archived, failed]
    ItbSourceType:
      type: string
      enum: [manual, gmail, outlook]
    ItbMailboxProvider:
      type: string
      enum: [google-mail, outlook]
    ItbExtractionStatus:
      type: string
      enum: [completed, partial, failed]
    ItbExtractedField:
      type: object
      required: [value, confidence, evidence]
      properties:
        value: { type: ["string", "null"] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidence: { type: string, maxLength: 1000 }
    ItbExtraction:
      type: object
      required: [issuer, contactName, contactEmail, contactPhone, projectName, location, dueDate, scope, requirements, alternates, estimatedValue]
      properties:
        issuer: { $ref: "#/components/schemas/ItbExtractedField" }
        contactName: { $ref: "#/components/schemas/ItbExtractedField" }
        contactEmail: { $ref: "#/components/schemas/ItbExtractedField" }
        contactPhone: { $ref: "#/components/schemas/ItbExtractedField" }
        projectName: { $ref: "#/components/schemas/ItbExtractedField" }
        location: { $ref: "#/components/schemas/ItbExtractedField" }
        dueDate: { $ref: "#/components/schemas/ItbExtractedField" }
        scope:
          type: array
          items: { $ref: "#/components/schemas/ItbExtractedField" }
        requirements:
          type: array
          items: { $ref: "#/components/schemas/ItbExtractedField" }
        alternates:
          type: array
          items: { $ref: "#/components/schemas/ItbExtractedField" }
        estimatedValue: { $ref: "#/components/schemas/ItbExtractedField" }
    ItbIntakeAttachment:
      type: object
      required: [id, originalName, contentType, size, downloadUrl, createdAt]
      properties:
        id: { type: integer }
        originalName: { type: string }
        contentType: { type: string }
        size: { type: integer, minimum: 0 }
        downloadUrl: { type: string }
        sourceAttachmentId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    ItbDocumentRole:
      type: string
      enum: [itb_invitation, scope, plans, specifications, addendum, other]
    ItbDocumentStatus:
      type: string
      enum: [queued, processing, completed, needs_review, failed]
    ItbDocumentFindingStatus:
      type: string
      enum: [proposed, accepted, rejected, corrected]
    ItbDocumentFinding:
      type: object
      required: [key, label, value, confidence, evidence, status]
      properties:
        key: { type: string, maxLength: 120 }
        label: { type: string, maxLength: 180 }
        value: { type: string, maxLength: 500 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidence: { type: string, maxLength: 700 }
        page: { type: ["integer", "null"], minimum: 1 }
        status: { $ref: "#/components/schemas/ItbDocumentFindingStatus" }
        correctedValue: { type: ["string", "null"], maxLength: 500 }
    ItbDocument:
      type: object
      required: [id, tenantId, environmentId, intakeId, attachmentId, originalName, contentType, role, status, parser, byteSize, findings, attemptCount, createdAt, updatedAt]
      properties:
        id: { type: integer }
        tenantId: { type: integer }
        environmentId: { type: integer }
        intakeId: { type: integer }
        attachmentId: { type: integer }
        originalName: { type: string }
        contentType: { type: string }
        downloadUrl: { type: string }
        role: { $ref: "#/components/schemas/ItbDocumentRole" }
        status: { $ref: "#/components/schemas/ItbDocumentStatus" }
        parser: { type: ["string", "null"] }
        parserVersion: { type: ["string", "null"] }
        sha256: { type: string }
        byteSize: { type: integer, minimum: 0 }
        pageCount: { type: ["integer", "null"], minimum: 1 }
        findings:
          type: array
          items: { $ref: "#/components/schemas/ItbDocumentFinding" }
        errorMessage: { type: ["string", "null"] }
        attemptCount: { type: integer, minimum: 0 }
        processedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ItbDocumentProcessInput:
      type: object
      required: [attachmentId]
      properties:
        attachmentId: { type: integer, minimum: 1 }
        role: { $ref: "#/components/schemas/ItbDocumentRole" }
    ItbDocumentFindingUpdate:
      type: object
      required: [key, status]
      properties:
        key: { type: string, minLength: 1, maxLength: 120 }
        status: { $ref: "#/components/schemas/ItbDocumentFindingStatus" }
        correctedValue: { type: ["string", "null"], maxLength: 500 }
    ItbEvidenceTargetType:
      type: string
      enum: [opportunity, bid, project]
    ItbDocumentEvidenceMapping:
      type: object
