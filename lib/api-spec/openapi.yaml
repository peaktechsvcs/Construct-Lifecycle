        "200":
          description: Updated subscription state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingActionResponse" }
  /billing/reactivate:
    post:
      operationId: reactivateBillingSubscription
      tags: [billing]
      summary: Remove a scheduled subscription cancellation
      responses:
        "200":
          description: Updated subscription state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingActionResponse" }
  /billing/invoices:
    get:
      operationId: listBillingInvoices
      tags: [billing]
      summary: List synced billing invoices
