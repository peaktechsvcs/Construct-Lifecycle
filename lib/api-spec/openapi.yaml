openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project lifecycle operations
  - name: project-controls
    description: General contractor contract administration and project controls
  - name: opportunities
    description: Pre-construction opportunity pipeline
  - name: customers
    description: Business customer records and project relationships
  - name: dashboard
    description: Dashboard summaries
  - name: notifications
    description: Customer-scoped alerts and notification read state
  - name: follow-ups
    description: Future work follow-ups
  - name: tenants
    description: Tenant context and membership operations
  - name: environments
    description: Customer environment context and switching
  - name: provisioning
    description: Isolated environment provisioning, recovery, and promotion controls
  - name: branding
    description: Tenant branding drafts and published versions
  - name: integrations
    description: Customer-scoped integration catalog and activity
  - name: membership
    description: Customer invitations and membership administration
  - name: platform
    description: Platform administrator customer lifecycle operations
  - name: billing
    description: Subscription plans, billing actions, entitlements, and audit history
  - name: workflows
    description: Tenant-configurable project lifecycle states, statuses, and transitions
  - name: submittals
    description: Bid-linked and post-award construction submittal packages
  - name: subcontractor-compliance
    description: Trade partner qualification, compliance gates, subcontracts, and payment rights
  - name: supplier-orders
    description: Supplier catalog, quoting, ordering, delivery, receiving, and payment visibility
  - name: itb-intakes
    description: Invitation-to-bid mailbox and document intake review
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: stage
          schema:
            $ref: "#/components/schemas/ProjectStage"
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Project deleted
  /projects/{projectId}/controls:
    get:
      operationId: getProjectControls
      tags: [project-controls]
      summary: Get the project controls workspace
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project controls summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectControlsSummary" }
        "404": { description: Project not found }
  /projects/{projectId}/controls/contract:
    put:
      operationId: upsertProjectContract
      tags: [project-controls]
      summary: Create or update the primary project contract
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectContractInput" }
      responses:
        "200":
          description: Project contract
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectContract" }
  /projects/{projectId}/controls/schedule:
    post:
      operationId: createProjectScheduleItem
      tags: [project-controls]
      summary: Add a project milestone or schedule item
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectScheduleItemInput" }
      responses:
        "201":
          description: Schedule item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectScheduleItem" }
  /projects/{projectId}/controls/schedule/{itemId}:
    patch:
      operationId: updateProjectScheduleItem
      tags: [project-controls]
      summary: Update a project milestone or schedule item
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectScheduleItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectScheduleItemUpdate" }
      responses:
        "200":
          description: Schedule item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectScheduleItem" }
  /projects/{projectId}/controls/sov:
    post:
      operationId: createScheduleOfValue
      tags: [project-controls]
      summary: Add a schedule of values line
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleOfValueInput" }
      responses:
        "201":
          description: Schedule of values line
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleOfValue" }
  /projects/{projectId}/controls/sov/{lineId}:
    patch:
      operationId: updateScheduleOfValue
      tags: [project-controls]
      summary: Update a schedule of values line
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectSovLineId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleOfValueUpdate" }
      responses:
        "200":
          description: Schedule of values line
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleOfValue" }
    delete:
      operationId: deleteScheduleOfValue
      tags: [project-controls]
      summary: Remove a schedule of values line
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectSovLineId"
      responses:
        "204": { description: Schedule of values line deleted }
  /projects/{projectId}/controls/commitments:
    post:
      operationId: createProjectCommitment
      tags: [project-controls]
      summary: Add a subcontractor or supplier commitment
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCommitmentInput" }
      responses:
        "201":
          description: Project commitment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCommitment" }
  /projects/{projectId}/controls/commitments/{commitmentId}:
    patch:
      operationId: updateProjectCommitment
      tags: [project-controls]
      summary: Update a project commitment
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectCommitmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCommitmentUpdate" }
      responses:
        "200":
          description: Project commitment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCommitment" }
  /projects/{projectId}/controls/issues:
    post:
      operationId: createProjectIssue
      tags: [project-controls]
      summary: Create an RFI or project issue
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectIssueInput" }
      responses:
        "201":
          description: Project issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectIssue" }
  /projects/{projectId}/controls/issues/{issueId}:
    patch:
      operationId: updateProjectIssue
      tags: [project-controls]
      summary: Update an RFI or project issue
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectIssueId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectIssueUpdate" }
      responses:
        "200":
          description: Project issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectIssue" }
  /projects/{projectId}/controls/change-orders:
    post:
      operationId: createProjectChangeOrder
      tags: [project-controls]
      summary: Create a change request or change order
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectChangeOrderInput" }
      responses:
        "201":
          description: Project change order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectChangeOrder" }
  /projects/{projectId}/controls/change-orders/{changeOrderId}:
    patch:
      operationId: updateProjectChangeOrder
      tags: [project-controls]
      summary: Update or approve a change request or change order
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectChangeOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectChangeOrderUpdate" }
      responses:
        "200":
          description: Project change order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectChangeOrder" }
  /projects/{projectId}/controls/financials:
    put:
      operationId: updateProjectFinancials
      tags: [project-controls]
      summary: Update project budget and forecast cost controls
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectFinancialsInput" }
      responses:
        "200":
          description: Project financial controls
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectFinancials" }
  /projects/{projectId}/controls/pay-applications:
    post:
      operationId: createProjectPayApplication
      tags: [project-controls]
      summary: Create an owner pay application
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectPayApplicationInput" }
      responses:
        "201":
          description: Owner pay application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPayApplication" }
  /projects/{projectId}/controls/pay-applications/{applicationId}:
    patch:
      operationId: updateProjectPayApplication
      tags: [project-controls]
      summary: Update an owner pay application
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectPayApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectPayApplicationUpdate" }
      responses:
        "200":
          description: Owner pay application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPayApplication" }
  /projects/{projectId}/controls/closeout-requirements:
    post:
      operationId: createProjectCloseoutRequirement
      tags: [project-controls]
      summary: Add a project closeout requirement
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCloseoutRequirementInput" }
      responses:
        "201":
          description: Closeout requirement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCloseoutRequirement" }
  /projects/{projectId}/controls/closeout-requirements/{requirementId}:
    patch:
      operationId: updateProjectCloseoutRequirement
      tags: [project-controls]
      summary: Update a project closeout requirement
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectCloseoutRequirementId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCloseoutRequirementUpdate" }
      responses:
        "200":
          description: Closeout requirement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCloseoutRequirement" }
  /trade-partners:
    get:
      operationId: listTradePartners
      tags: [subcontractor-compliance]
      summary: List trade partners with compliance gates
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 120 }
        - in: query
          name: status
          schema: { type: string, enum: [active, archived] }
      responses:
        "200":
          description: Trade partners
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TradePartner" }
    post:
      operationId: createTradePartner
      tags: [subcontractor-compliance]
      summary: Create a trade partner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradePartnerInput" }
      responses:
        "201":
          description: Trade partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradePartner" }
  /trade-partners/{tradePartnerId}:
    get:
      operationId: getTradePartner
      tags: [subcontractor-compliance]
      summary: Get a trade partner with compliance history
      parameters:
        - $ref: "#/components/parameters/TradePartnerId"
      responses:
        "200":
          description: Trade partner detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradePartnerDetail" }
    patch:
      operationId: updateTradePartner
      tags: [subcontractor-compliance]
      summary: Update trade partner qualification
      parameters:
        - $ref: "#/components/parameters/TradePartnerId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradePartnerUpdate" }
      responses:
        "200":
          description: Trade partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradePartner" }
  /trade-partners/{tradePartnerId}/compliance-documents:
    post:
      operationId: createTradePartnerComplianceDocument
      tags: [subcontractor-compliance]
      summary: Request or submit a trade partner compliance document
      parameters:
        - $ref: "#/components/parameters/TradePartnerId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplianceDocumentInput" }
      responses:
        "201":
          description: Compliance document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceDocument" }
  /trade-partners/{tradePartnerId}/compliance-documents/request-upload:
    post:
      operationId: requestTradePartnerComplianceDocumentUpload
      tags: [subcontractor-compliance]
      summary: Request a protected compliance document upload URL
      parameters:
        - $ref: "#/components/parameters/TradePartnerId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplianceDocumentUploadInput" }
      responses:
        "201":
          description: Upload URL and pending compliance document metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceDocumentUpload" }
  /trade-partners/{tradePartnerId}/compliance-documents/{documentId}:
    patch:
      operationId: updateTradePartnerComplianceDocument
      tags: [subcontractor-compliance]
      summary: Review a trade partner compliance document
      parameters:
        - $ref: "#/components/parameters/TradePartnerId"
        - $ref: "#/components/parameters/ComplianceDocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplianceDocumentUpdate" }
      responses:
        "200":
          description: Compliance document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceDocument" }
  /trade-partners/{tradePartnerId}/compliance-documents/{documentId}/request-replacement:
    post:
      operationId: requestTradePartnerComplianceDocumentReplacement
      tags: [subcontractor-compliance]
      summary: Request a replacement compliance document upload URL
      parameters:
        - $ref: "#/components/parameters/TradePartnerId"
        - $ref: "#/components/parameters/ComplianceDocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplianceDocumentFileInput" }
      responses:
        "201":
          description: Replacement upload URL and pending compliance document metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceDocumentUpload" }
  /trade-partners/{tradePartnerId}/compliance-documents/{documentId}/complete:
    post:
      operationId: completeTradePartnerComplianceDocumentUpload
      tags: [subcontractor-compliance]
      summary: Complete and screen a compliance document upload
      parameters:
        - $ref: "#/components/parameters/TradePartnerId"
        - $ref: "#/components/parameters/ComplianceDocumentId"
      responses:
        "200":
          description: Submitted compliance document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceDocument" }
  /trade-partners/{tradePartnerId}/compliance-documents/{documentId}/file:
    get:
      operationId: getTradePartnerComplianceDocumentFile
      tags: [subcontractor-compliance]
      summary: Stream a protected compliance document
      parameters:
        - $ref: "#/components/parameters/TradePartnerId"
        - $ref: "#/components/parameters/ComplianceDocumentId"
      responses:
        "200": { description: Protected compliance document bytes }
  /projects/{projectId}/compliance-requirements:
    get:
      operationId: listProjectComplianceRequirements
      tags: [subcontractor-compliance]
      summary: List project compliance requirements
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project compliance requirements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectComplianceRequirement" }
    post:
      operationId: createProjectComplianceRequirement
      tags: [subcontractor-compliance]
      summary: Configure a project compliance gate
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectComplianceRequirementInput" }
      responses:
        "201":
          description: Project compliance requirement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectComplianceRequirement" }
  /projects/{projectId}/compliance-requirements/{requirementId}:
    patch:
      operationId: updateProjectComplianceRequirement
      tags: [subcontractor-compliance]
      summary: Update a project compliance gate
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectComplianceRequirementId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectComplianceRequirementUpdate" }
      responses:
        "200":
          description: Project compliance requirement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectComplianceRequirement" }
  /subcontract-agreements:
    get:
      operationId: listSubcontractAgreements
      tags: [subcontractor-compliance]
      summary: List subcontract agreements
      parameters:
        - in: query
          name: projectId
          schema: { type: integer }
        - in: query
          name: tradePartnerId
          schema: { type: integer }
      responses:
        "200":
          description: Subcontract agreements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubcontractAgreement" }
  /projects/{projectId}/subcontract-agreements:
    post:
      operationId: createSubcontractAgreement
      tags: [subcontractor-compliance]
      summary: Create a subcontract agreement
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubcontractAgreementInput" }
      responses:
        "201":
          description: Subcontract agreement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubcontractAgreementDetail" }
  /subcontract-agreements/{agreementId}:
    get:
      operationId: getSubcontractAgreement
      tags: [subcontractor-compliance]
      summary: Get a subcontract agreement with payment and closeout history
      parameters:
        - $ref: "#/components/parameters/SubcontractAgreementId"
      responses:
        "200":
          description: Subcontract agreement detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubcontractAgreementDetail" }
  /subcontract-agreements/{agreementId}/schedule-of-values:
    post:
      operationId: createSubcontractScheduleOfValue
      tags: [subcontractor-compliance]
      summary: Add a subcontract schedule-of-values line
      parameters:
        - $ref: "#/components/parameters/SubcontractAgreementId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubcontractScheduleOfValueInput" }
      responses:
        "201":
          description: Schedule-of-values line
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubcontractScheduleOfValue" }
  /subcontract-agreements/{agreementId}/change-orders:
    post:
      operationId: createSubcontractChangeOrder
      tags: [subcontractor-compliance]
      summary: Submit a subcontract change order
      parameters:
        - $ref: "#/components/parameters/SubcontractAgreementId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubcontractChangeOrderInput" }
      responses:
        "201":
          description: Subcontract change order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubcontractChangeOrder" }
  /subcontract-agreements/{agreementId}/pay-applications:
    post:
      operationId: createSubcontractPayApplication
      tags: [subcontractor-compliance]
      summary: Submit a subcontract progress pay application
      parameters:
        - $ref: "#/components/parameters/SubcontractAgreementId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubcontractPayApplicationInput" }
      responses:
        "201":
          description: Subcontract pay application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubcontractPayApplication" }
  /subcontract-pay-applications/{applicationId}/waivers:
    post:
      operationId: createSubcontractWaiver
      tags: [subcontractor-compliance]
      summary: Record a conditional, unconditional, or final waiver
      parameters:
        - $ref: "#/components/parameters/SubcontractPayApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubcontractWaiverInput" }
      responses:
        "201":
          description: Waiver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubcontractWaiver" }
  /subcontract-agreements/{agreementId}/closeout-items:
    post:
      operationId: createSubcontractCloseoutItem
      tags: [subcontractor-compliance]
      summary: Add a warranty, as-built, O&M, or final release requirement
      parameters:
        - $ref: "#/components/parameters/SubcontractAgreementId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubcontractCloseoutItemInput" }
      responses:
        "201":
          description: Subcontract closeout item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubcontractCloseoutItem" }
  /supplier-products:
    get:
      operationId: listSupplierProducts
      tags: [supplier-orders]
      summary: List supplier products and materials
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 120 }
        - in: query
          name: status
          schema: { type: string, enum: [active, archived] }
      responses:
        "200":
          description: Supplier products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupplierProduct" }
    post:
      operationId: createSupplierProduct
      tags: [supplier-orders]
      summary: Add a supplier product or material
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierProductInput" }
