openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project lifecycle operations
  - name: customers
    description: Business customer records and project relationships
  - name: dashboard
    description: Dashboard summaries
  - name: follow-ups
    description: Future work follow-ups
  - name: tenants
    description: Tenant context and membership operations
  - name: environments
    description: Customer environment context and switching
  - name: branding
    description: Tenant branding drafts and published versions
  - name: integrations
    description: Customer-scoped integration catalog and activity
  - name: membership
    description: Customer invitations and membership administration
  - name: platform
    description: Platform administrator customer lifecycle operations
  - name: billing
    description: Subscription plans, billing actions, entitlements, and audit history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: stage
          schema:
            $ref: "#/components/schemas/ProjectStage"
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Project deleted
  /projects/{projectId}/activity:
    get:
      operationId: listProjectActivity
      tags: [projects]
      summary: List project activity
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /customers:
    get:
      operationId: listBusinessCustomers
      tags: [customers]
      summary: List business customers in the active workspace
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
        - in: query
          name: includeArchived
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Business customers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BusinessCustomerSummary" }
    post:
      operationId: createBusinessCustomer
      tags: [customers]
      summary: Create a business customer in the active workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessCustomerInput" }
      responses:
        "201":
          description: Business customer created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessCustomer" }
        "403": { description: Customer creation permission required }
        "409": { description: A customer with the same normalized name already exists }
  /customers/{customerId}:
    get:
      operationId: getBusinessCustomer
      tags: [customers]
      summary: Get a business customer and its projects
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Business customer detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessCustomer" }
        "404": { description: Business customer not found }
    patch:
      operationId: updateBusinessCustomer
      tags: [customers]
      summary: Update a business customer
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessCustomerUpdate" }
      responses:
        "200":
          description: Updated business customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessCustomer" }
        "403": { description: Customer management permission required }
        "404": { description: Business customer not found }
        "409": { description: A customer with the same normalized name already exists }
  /follow-ups:
    get:
      operationId: listFollowUps
      tags: [follow-ups]
      summary: List future work follow-ups
      responses:
        "200":
          description: Follow-ups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FollowUp"
    post:
      operationId: createFollowUp
      tags: [follow-ups]
      summary: Create a follow-up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowUpInput"
      responses:
        "201":
          description: Follow-up created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUp"
  /follow-ups/{followUpId}:
    patch:
      operationId: updateFollowUp
      tags: [follow-ups]
      summary: Update a follow-up
      parameters:
        - $ref: "#/components/parameters/FollowUpId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowUpUpdate"
      responses:
        "200":
          description: Follow-up updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUp"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: listRecentActivity
      tags: [dashboard]
      summary: List recent activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /dashboard/drilldown:
    get:
      operationId: getDashboardDrilldown
      tags: [dashboard]
      summary: Inspect records contributing to a dashboard metric
      parameters:
        - in: query
          name: type
          required: true
          schema:
            $ref: "#/components/schemas/DashboardDrilldownType"
        - in: query
          name: stage
          schema:
            $ref: "#/components/schemas/ProjectStage"
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: sort
          schema:
            $ref: "#/components/schemas/DashboardDrilldownSort"
      responses:
        "200":
          description: Dashboard supporting records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardDrilldownResponse"
        "400": { description: Invalid drilldown discriminator or stage }
  /tenant/context:
    get:
      operationId: getTenantContext
      tags: [tenants]
      summary: Get the active tenant context
      responses:
        "200":
          description: Active tenant and memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantContext"
    post:
      operationId: switchTenant
      tags: [tenants]
      summary: Switch the active tenant after membership validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchTenantInput"
      responses:
        "200":
          description: Updated tenant context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantContext"
        "403": { description: User is not a member of the tenant }
  /tenant/environments:
    get:
      operationId: listEnvironments
      tags: [environments]
      summary: List environments authorized for the active customer
      responses:
        "200":
          description: Authorized customer environments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Environment" }
    post:
      operationId: switchEnvironment
      tags: [environments]
      summary: Switch the active customer environment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchEnvironmentInput" }
      responses:
        "200":
          description: Updated customer environment context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantContext" }
        "403": { description: User is not authorized for the environment }
  /tenant/members:
    get:
      operationId: listTenantMembers
      tags: [membership]
      summary: List members of the active customer
      responses:
        "200":
          description: Customer members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TenantMember" }
        "403": { description: Customer administrator permission required }
  /tenant/members/{userId}:
    patch:
      operationId: updateTenantMember
      tags: [membership]
      summary: Change a customer's member role
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTenantMemberInput" }
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantMember" }
        "403": { description: Customer administrator permission required }
        "409": { description: The last owner cannot be removed }
    delete:
      operationId: removeTenantMember
      tags: [membership]
      summary: Remove a member from the active customer
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Member removed }
        "403": { description: Customer administrator permission required }
        "409": { description: The last owner cannot be removed }
  /tenant/invitations:
    get:
      operationId: listTenantInvitations
      tags: [membership]
      summary: List invitations for the active customer
      responses:
        "200":
          description: Customer invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TenantInvitation" }
        "403": { description: Customer administrator permission required }
    post:
      operationId: createTenantInvitation
      tags: [membership]
      summary: Invite a user to the active customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTenantInvitationInput" }
      responses:
        "201":
          description: Invitation created; the token is returned only once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedTenantInvitation" }
        "403": { description: Customer administrator permission required }
        "409": { description: Active invitation already exists }
  /tenant/invitations/{invitationId}/revoke:
    post:
      operationId: revokeTenantInvitation
      tags: [membership]
      summary: Revoke a pending customer invitation
      parameters:
        - in: path
          name: invitationId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Revoked invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantInvitation" }
        "403": { description: Customer administrator permission required }
  /tenant/invitations/token/{token}:
    get:
      operationId: getInvitationDetails
      tags: [membership]
      summary: Inspect an invitation link for the signed-in user
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, minLength: 32 }
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationDetails" }
        "404": { description: Invitation not found }
  /tenant/invitations/token/{token}/accept:
    post:
      operationId: acceptTenantInvitation
      tags: [membership]
      summary: Accept an invitation for the authenticated user
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, minLength: 32 }
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedTenantInvitation" }
        "404": { description: Invitation not found }
        "409": { description: Invitation is no longer active }
  /platform/customers:
    get:
      operationId: listPlatformCustomers
      tags: [platform]
      summary: List customer workspaces for platform administrators
      responses:
        "200":
          description: Customer workspaces
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformCustomer" }
        "403": { description: Platform administrator permission required }
    post:
      operationId: createPlatformCustomer
      tags: [platform]
      summary: Create a customer workspace and its environments
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePlatformCustomerInput" }
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedPlatformCustomer" }
        "403": { description: Platform administrator permission required }
        "409": { description: Customer slug already exists }
  /platform/customers/{tenantId}:
    patch:
      operationId: updatePlatformCustomer
      tags: [platform]
      summary: Suspend or reactivate a customer workspace
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePlatformCustomerInput" }
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformCustomer" }
        "403": { description: Platform administrator permission required }
        "404": { description: Customer not found }
  /platform/releases:
    get:
      operationId: listPlatformReleases
      tags: [environments]
      summary: List platform releases and environment assignments
      responses:
        "200":
          description: Platform releases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformRelease" }
  /billing/plans:
    get:
      operationId: listBillingPlans
      tags: [billing]
      summary: List active subscription plans
      responses:
        "200":
          description: Subscription plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BillingPlan" }
  /billing:
    get:
      operationId: getBilling
      tags: [billing]
      summary: Get the active workspace billing state
      responses:
        "200":
          description: Billing state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingResponse" }
  /billing/checkout:
    post:
      operationId: createBillingCheckout
      tags: [billing]
      summary: Create a Stripe subscription checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingCheckoutInput" }
      responses:
        "200":
          description: Checkout session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingCheckoutResponse" }
  /billing/portal:
    post:
      operationId: createBillingPortal
      tags: [billing]
      summary: Create a Stripe customer portal session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingPortalInput" }
      responses:
        "200":
          description: Portal session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingCheckoutResponse" }
  /billing/cancel:
    post:
      operationId: cancelBillingSubscription
      tags: [billing]
      summary: Cancel the current subscription at period end
      responses:
        "200":
          description: Updated subscription state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingActionResponse" }
  /billing/reactivate:
    post:
      operationId: reactivateBillingSubscription
      tags: [billing]
      summary: Remove a scheduled subscription cancellation
      responses:
        "200":
          description: Updated subscription state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingActionResponse" }
  /billing/invoices:
    get:
      operationId: listBillingInvoices
      tags: [billing]
      summary: List synced billing invoices
      responses:
        "200":
          description: Billing invoices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BillingInvoice" }
  /billing/audit:
    get:
      operationId: listBillingAuditEvents
      tags: [billing]
      summary: List subscription and entitlement audit events
      responses:
        "200":
          description: Billing audit events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BillingAuditEvent" }
  /platform/billing/plans:
    get:
      operationId: listPlatformBillingPlans
      tags: [billing, platform]
      summary: List all platform-managed plans
      responses:
        "200":
          description: Platform plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BillingPlan" }
    post:
      operationId: createPlatformBillingPlan
      tags: [billing, platform]
      summary: Create a Stripe product with monthly and annual prices
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBillingPlanInput" }
      responses:
        "201":
          description: Created plan identifiers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateBillingPlanResponse" }
  /platform/billing/entitlements/{tenantId}:
    patch:
      operationId: updatePlatformEntitlementOverride
      tags: [billing, platform]
      summary: Override one effective tenant entitlement
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntitlementOverrideInput" }
      responses:
        "200":
          description: Updated entitlement override
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntitlementOverride" }
  /tenant/branding:
    get:
      operationId: getBranding
      tags: [branding]
      summary: Get branding context and current draft
      responses:
        "200":
          description: Branding context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingContext"
        "403": { description: Customer administrator permission required }
    put:
      operationId: saveBrandingDraft
      tags: [branding]
      summary: Save a branding draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingInput"
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingContext"
        "403": { description: Customer administrator permission required }
  /tenant/branding/published:
    get:
      operationId: getPublishedBranding
      tags: [branding]
      summary: Get published branding for the active customer environment
      responses:
        "200":
          description: Published branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedBrandingContext"
  /tenant/branding/publish:
    post:
      operationId: publishBranding
      tags: [branding]
      summary: Publish the draft after WCAG AA contrast validation
      responses:
        "200":
          description: Published branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingVersion"
        "422": { description: Branding fails WCAG AA contrast validation }
  /tenant/branding/rollback/{version}:
    post:
      operationId: rollbackBranding
      tags: [branding]
      summary: Roll back to an immutable published version
      parameters:
        - in: path
          name: version
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Rolled-back draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingContext"
        "404": { description: Version not found }
  /tenant/branding/reset:
    post:
      operationId: resetBranding
      tags: [branding]
      summary: Reset branding draft to Construct Lifecycle defaults
      responses:
        "200":
          description: Reset draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingContext"
  /integrations:
    get:
      operationId: listIntegrations
      tags: [integrations]
      summary: List entitled integrations for the active customer environment
      responses:
        "200":
          description: Entitled integration catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IntegrationCatalogItem" }
        "403": { description: Customer administrator permission required }
  /integrations/activity:
    get:
      operationId: listIntegrationActivity
      tags: [integrations]
      summary: List integration configuration and audit activity
      parameters:
        - in: query
          name: providerKey
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_]{1,63}$"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Integration activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IntegrationActivity" }
        "404": { description: Integration provider not available }
components:
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        type: integer
    FollowUpId:
      in: path
      name: followUpId
      required: true
      schema:
        type: integer
    CustomerId:
      in: path
      name: customerId
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProjectStage:
      type: string
      enum:
        - opportunity
        - bid
        - award
        - contract
        - procure
        - deliver
        - financial
        - closeout
    ProposalStatus:
      type: string
      enum: [not_started, drafting, submitted, revised, accepted]
    BidOutcome:
      type: string
      enum: [pending, won, lost, no_bid]
    ContractStatus:
      type: string
      enum: [none, requested, active, complete]
    BillingStatus:
      type: string
      enum: [not_started, deposit_pending, invoicing, partially_paid, paid]
    CloseoutStatus:
      type: string
      enum: [not_started, punch_list, customer_review, complete]
    Project:
      type: object
      required:
        - id
        - projectNumber
        - customerName
        - projectName
        - category
        - stage
        - proposalStatus
        - bidOutcome
        - contractStatus
        - contractValue
        - deliveryPercent
        - billingStatus
        - invoicedAmount
        - receivedAmount
        - closeoutStatus
        - createdAt
        - updatedAt
      properties:
        id: { type: integer }
        environmentId: { type: integer }
        projectNumber: { type: string }
        businessCustomerId: { type: ["integer", "null"] }
        businessCustomer:
          oneOf:
            - $ref: "#/components/schemas/BusinessCustomerSummary"
            - type: "null"
        customerName: { type: string }
        projectName: { type: string }
        address: { type: ["string", "null"] }
        category: { type: string }
        productCategories:
          type: array
          items: { type: string }
        owner: { type: ["string", "null"] }
        stage: { $ref: "#/components/schemas/ProjectStage" }
        proposalStatus: { $ref: "#/components/schemas/ProposalStatus" }
