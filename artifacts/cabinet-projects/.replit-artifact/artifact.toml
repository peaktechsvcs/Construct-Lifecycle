kind = "web"
previewPath = "/"
title = "Cabinet Projects"
description = "A project operations workspace for cabinet, countertop, flooring, lighting, and hardware suppliers to manage customer bids, contracts, delivery, billing, closeout, and future work follow-up."
version = "1.0.0"
id = "artifacts/cabinet-projects"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25539

[services.development]
run = "pnpm --filter @workspace/cabinet-projects run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cabinet-projects", "run", "build" ]
serve = "static"
publicDir = "artifacts/cabinet-projects/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25539"
BASE_PATH = "/"
