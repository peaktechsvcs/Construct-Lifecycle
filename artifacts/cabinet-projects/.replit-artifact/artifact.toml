kind = "web"
previewPath = "/legacy-cabinet-projects/"
title = "Construct Lifecycle"
description = "Construct Lifecycle is a multi-tenant construction lifecycle platform for managing customer bids, contracts, delivery, billing, closeout, and future work from one project-centered workspace."
version = "1.0.0"
id = "artifacts/cabinet-projects"
router = "path"

[[services]]
name = "web"
paths = [ "/legacy-cabinet-projects/" ]
localPort = 25539

[services.development]
run = "pnpm --filter @workspace/cabinet-projects run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cabinet-projects", "run", "build" ]
serve = "static"
publicDir = "artifacts/cabinet-projects/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25539"
BASE_PATH = "/legacy-cabinet-projects/"